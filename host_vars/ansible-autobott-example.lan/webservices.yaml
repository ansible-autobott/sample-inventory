run_role_docmost: true
docmost:
  app_url: "https://wiki.ansible-autobott-example.lan"
  db_pass: "changeMe"
  app_secret: "REPLACE_WITH_LONG_SECRET_REPLACE_WITH_LONG_SECRET_"

#============================================================================================================
# Mealie
