# For the sake of a runnable example this file is CLEAR TEXT. In a real
# inventory you must always keep it encrypted with SOPS (see README + the
# top-level .sops.yaml / sops_key.README.md). To encrypt it:
#   1. make age-key INV=<inventory>            # create your key, get your pubkey
#   2. put your pubkey in .sops.yaml           # replace the sample recipient
#   3. git mv host_vars/<host>/secrets.yaml host_vars/<host>/secrets.sops.yaml
#   4. make seal-secrets INV=<inventory> HOST=ansible-autobott-example.lan
# Ansible loads any *.yaml in this dir, so the filename change is transparent to
# the playbook; the .sops.yaml suffix is only what makes SOPS/ansible decrypt it.

